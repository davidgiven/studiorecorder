# Vala formatting: four spaces, indented namespaces/classes, Allman-style braces.
indent_columns = 4
indent_with_tabs = 0
indent_namespace = true
indent_class = true
indent_switch_case = 4
indent_switch_body = 4
# Indent lambda blocks inside call arguments relative to the argument list.
indent_paren_open_brace = true
sp_before_sparen = force
sp_func_def_paren = remove
sp_func_call_paren = remove
# Uncrustify classifies Vala yield calls as function prototypes.
sp_func_proto_paren = remove
nl_fdef_brace = force
nl_if_brace = force
nl_for_brace = force
nl_while_brace = force
nl_namespace_brace = force
nl_class_brace = force
nl_enum_brace = force
nl_struct_brace = force
nl_switch_brace = force
nl_else_brace = force
nl_elseif_brace = force
nl_try_brace = force
nl_catch_brace = force
nl_finally_brace = force
nl_brace_else = force
nl_brace_catch = force
nl_brace_finally = force
nl_getset_brace = force
nl_property_brace = force
nl_before_brace_open = true
nl_after_brace_open = true
nl_after_semicolon = true
# Keep case labels separate so a clause cannot be only partly inline.
nl_after_case = true
# Start wrapped argument lists below the opening parenthesis.
nl_func_call_start_multi_line = true
nl_func_call_args_multi_line = true
# Cover yield calls that Vala parsing classifies as declarations.
nl_func_decl_start_multi_line = true
nl_func_decl_args_multi_line = true
