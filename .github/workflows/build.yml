name: Ubuntu build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            pkg-config \
            valac \
            libgtk-4-dev \
            libadwaita-1-dev \
            libpanel-dev \
            libgstreamer1.0-dev \
            libglib2.0-dev \
            libx11-dev \
            linux-libc-dev

      - name: Build
        run: make --jobs=2
